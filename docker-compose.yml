services:
  postgres:
    image: postgres:16
    container_name: lab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dados:/dados:ro

  mysql:
    image: mysql:8.4
    container_name: lab-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: olist
    command: ["--local-infile=1"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./dados:/dados:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lab-sqlserver
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
      - ./dados:/dados:ro

  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: lab-oracle
    profiles: ["oracle"]
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracledata:/opt/oracle/oradata
      - ./dados:/dados:ro

volumes:
  pgdata:
  mysqldata:
  sqlserverdata:
  oracledata:
